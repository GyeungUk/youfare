spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:youfare}
    username: ${DB_USERNAME:youfare}
    password: ${DB_PASSWORD:youfare}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${KAKAO_CLIENT_ID:c140ef432f0f21aa4ae23ce23f639304}
            client-secret: ${KAKAO_CLIENT_SECRET:C5TmDbpZOtSDbIExS0Q2MwVqSJ3Dbg6s}
            redirect-uri: "{baseUrl}/login/oauth2/code/kakao"
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
            # scope 미지정: 카카오 콘솔 동의항목 설정과 무관하게 로그인 보장 (유저 식별용 id만 사용).
            # 닉네임을 받고 싶으면 콘솔에서 '닉네임' 동의항목을 켠 뒤 아래 scope를 복구하면 됨.
            #   scope:
            #     - profile_nickname
          naver:
            client-id: ${NAVER_CLIENT_ID:dummy-naver-client-id}
            client-secret: ${NAVER_CLIENT_SECRET:dummy-naver-client-secret}
            redirect-uri: "{baseUrl}/login/oauth2/code/naver"
            authorization-grant-type: authorization_code
            scope:
              - name
              - email
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response

frontend:
  url: ${FRONTEND_URL:http://localhost:5173}

jwt:
  secret: ${JWT_SECRET:youfare-local-dev-jwt-secret-key-minimum-32chars}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

public-data:
  api-key: ${PUBLIC_DATA_API_KEY:dummy-public-data-api-key}
  base-url: ${PUBLIC_DATA_BASE_URL:https://www.bokjiro.go.kr/ssis-tbu/twataa/wlfareInfo/moveTWAT52011M.do}

openai:
  api-key: ${OPENAI_API_KEY:dummy-openai-api-key}
  base-url: https://api.openai.com/v1
  model: ${OPENAI_MODEL:gpt-4o-mini}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
