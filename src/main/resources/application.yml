server:
  # Render/Railway 등 PaaS는 PORT 환경변수로 바인딩 포트를 주입한다. 없으면 8080.
  port: ${PORT:8080}
  # 리버스 프록시(HTTPS 종단) 뒤에서 X-Forwarded-* 헤더를 신뢰해
  # OAuth redirect_uri의 {baseUrl}이 http가 아닌 실제 https 도메인으로 생성되게 한다.
  forward-headers-strategy: framework

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:youfare}
    username: ${DB_USERNAME:youfare}
    password: ${DB_PASSWORD:youfare}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    # 운영에선 SQL 로그가 과도해 기본 false. 개발 시 JPA_SHOW_SQL=true 로 켠다.
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: ${JPA_SHOW_SQL:false}
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

  # 업로드 용량의 1차(컨테이너) 방어선. 세부 정책(10개/각 20MB/총 50MB)은 MediaUploadValidator가 담당하므로
  # 여기선 정책보다 약간 넉넉히 잡아, 정책 위반이 친절한 메시지로 응답되게 한다(극단적 초과만 여기서 차단).
  servlet:
    multipart:
      max-file-size: ${MULTIPART_MAX_FILE_SIZE:21MB}
      max-request-size: ${MULTIPART_MAX_REQUEST_SIZE:55MB}

  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            # 기본은 {baseUrl}(요청 호스트 기준). 터널/배포 시 KAKAO_REDIRECT_URI로 외부 https 주소를 강제 지정한다.
            redirect-uri: "${KAKAO_REDIRECT_URI:{baseUrl}/login/oauth2/code/kakao}"
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
            # scope 미지정: 카카오 콘솔 동의항목 설정과 무관하게 로그인 보장 (유저 식별용 id만 사용).
            # 닉네임을 받고 싶으면 콘솔에서 '닉네임' 동의항목을 켠 뒤 아래 scope를 복구하면 됨.
            #   scope:
            #     - profile_nickname
          naver:
            client-id: ${NAVER_CLIENT_ID}
            client-secret: ${NAVER_CLIENT_SECRET}
            redirect-uri: "${NAVER_REDIRECT_URI:{baseUrl}/login/oauth2/code/naver}"
            authorization-grant-type: authorization_code
            scope:
              - name
              - email
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response

frontend:
  url: ${FRONTEND_URL:http://localhost:5173}

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

public-data:
  api-key: ${PUBLIC_DATA_API_KEY}
  base-url: ${PUBLIC_DATA_BASE_URL:https://www.youthcenter.go.kr/go/ythip/getPlcy}

# Groq는 OpenAI 호환 API라 엔드포인트/요청·응답 포맷이 동일해 기존 OpenAiClient 코드를 그대로 사용한다.
# 무료 키 발급: https://console.groq.com/keys  (gsk_ 로 시작)
openai:
  api-key: ${GROQ_API_KEY}
  base-url: ${OPENAI_BASE_URL:https://api.groq.com/openai/v1}
  model: ${OPENAI_MODEL:llama-3.3-70b-versatile}
  # temperature를 낮추면 답변이 결정적·집중적이 되어 Llama의 한자 섞임과 산만함이 크게 줄어든다.
  temperature: ${OPENAI_TEMPERATURE:0.3}
  top-p: ${OPENAI_TOP_P:0.9}

# AI 상담 정책
chat:
  # 비로그인(게스트) 1일 AI 상담 허용 횟수 (IP 기준). 로그인 유저는 제한 없음.
  guest-daily-limit: ${CHAT_GUEST_DAILY_LIMIT:5}

# 이메일 인증 정책
auth:
  email:
    # 인증번호 유효시간(초). 기본 3분.
    code-ttl-seconds: ${AUTH_EMAIL_CODE_TTL_SECONDS:180}
    # 발신 주소. Resend는 도메인 인증 없이 onboarding@resend.dev 로 발송 가능(테스트용).
    # 자체 도메인을 Resend에 등록했다면 no-reply@yourdomain 형태로 교체.
    from: ${MAIL_FROM:onboarding@resend.dev}

# 이메일 발송용 Resend HTTP API (Render가 SMTP 아웃바운드를 차단하므로 SMTP 대신 사용).
# https://resend.com 가입 → API Keys 에서 re_... 키 발급 → RESEND_API_KEY 에 입력.
resend:
  base-url: ${RESEND_BASE_URL:https://api.resend.com}
  api-key: ${RESEND_API_KEY:}

# 관리자 API 보호
admin:
  # /admin/welfare/sync 수동 동기화 호출 시 요구하는 키(헤더 X-ADMIN-KEY).
  # 비워두면 엔드포인트는 항상 차단된다(평소엔 시더/스케줄러가 자동 동기화하므로 호출 불필요).
  api-key: ${ADMIN_API_KEY:}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

# 이미지 저장소. 개발은 local(디스크), 배포는 s3(S3 호환: AWS S3 / Cloudflare R2 / MinIO).
# 환경마다 STORAGE_TYPE 하나만 바꾸면 되고, 검증 로직은 종류와 무관하게 동일하게 동작한다.
storage:
  type: ${STORAGE_TYPE:local}
  local:
    base-dir: ${STORAGE_LOCAL_DIR:./uploads}
    base-url: ${STORAGE_LOCAL_BASE_URL:http://localhost:8080/uploads}
  s3:
    bucket: ${S3_BUCKET:}
    region: ${S3_REGION:ap-northeast-2}
    # AWS가 아닌 S3 호환 스토리지(R2/MinIO)일 때만 지정. 비우면 AWS 기본 엔드포인트.
    endpoint: ${S3_ENDPOINT:}
    access-key: ${S3_ACCESS_KEY:}
    secret-key: ${S3_SECRET_KEY:}
    # 공개 URL 접두어(CDN/커스텀 도메인/r2.dev). 비우면 AWS virtual-hosted URL 자동 생성.
    public-base-url: ${S3_PUBLIC_BASE_URL:}
