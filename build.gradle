plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.5'
    id 'io.spring.dependency-management' version '1.1.6'
}

group = 'com.youfare'
version = '0.0.1-SNAPSHOT'
description = 'youfare'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    // 이메일 인증번호 발송(Resend HTTP API)·AI 상담 등 외부 HTTP 호출용 WebClient 제공.
    implementation 'org.springframework.boot:spring-boot-starter-webflux'

    // PostgreSQL
    runtimeOnly 'org.postgresql:postgresql'

    // JWT
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

    // Swagger / springdoc-openapi
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.6.0'

    // .env 자동 로드 (Spring 기본은 .env를 읽지 않으므로, application.yml의 ${ENV} 자리표시자를 .env로 채워줌)
    implementation 'me.paulschwarz:spring-dotenv:4.0.0'

    // S3 호환 오브젝트 스토리지(AWS S3 / Cloudflare R2 / MinIO) — 배포용 이미지 저장.
    // url-connection-client: JDK 내장 HTTP 클라이언트로, Netty/Apache 의존성 무게를 피한다.
    implementation platform('software.amazon.awssdk:bom:2.28.16')
    implementation 'software.amazon.awssdk:s3'
    implementation 'software.amazon.awssdk:url-connection-client'

    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testRuntimeOnly 'com.h2database:h2'
}

tasks.named('test') {
    useJUnitPlatform()
}
